services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: chess-game-analyzer:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/chess_analyzer.db}
      DATA_DIR: /app/data
      STOCKFISH_PATH: ${STOCKFISH_PATH:-/usr/games/stockfish}
      STOCKFISH_DEPTH: ${STOCKFISH_DEPTH:-16}
      STOCKFISH_MULTIPV: ${STOCKFISH_MULTIPV:-3}
      CHESSCOM_USER_AGENT: ${CHESSCOM_USER_AGENT:-chess-game-analyzer/0.1 docker-compose}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - chess_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: chess-game-analyzer:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chess_data:
