[project]
name = "chess-game-analyzer"
version = "0.1.0"
description = "FastAPI backend for importing and analyzing Chess.com games with Stockfish."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-chess>=1.999",
  "httpx>=0.27.0",
  "sqlalchemy>=2.0.30",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "streamlit>=1.36.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "respx>=0.21.1", "ruff>=0.5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
